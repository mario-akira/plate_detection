# Dataset de placas no formato YOLO.
# Se você usar  train_export.py --voc <pasta_do_kaggle>  este arquivo é
# reescrito automaticamente com o caminho absoluto do dataset convertido.
#
# Estrutura:
#   datasets/placas/images/train/*.png   datasets/placas/labels/train/*.txt
#   datasets/placas/images/val/*.png     datasets/placas/labels/val/*.txt
# Cada .txt tem uma linha por placa:  0 cx cy w h   (valores normalizados 0..1)
# Prefira um caminho absoluto em "path".

path: datasets/placas
train: images/train
val: images/val

names:
  0: placa
